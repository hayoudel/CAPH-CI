# Services de développement : base PostgreSQL + boîte mail de test (Mailpit)
services:
  db:
    image: postgres:16-alpine
    container_name: caphci-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: caphci
      POSTGRES_PASSWORD: caphci_dev_password
      POSTGRES_DB: caphci_oph
    ports:
      - "5433:5432"   # 5433 côté machine : évite le conflit avec un PostgreSQL local déjà installé
    volumes:
      - caphci_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caphci -d caphci_oph"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: caphci-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web : http://localhost:8025

volumes:
  caphci_pgdata:
